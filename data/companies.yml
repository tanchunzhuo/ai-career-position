# data/companies.yml — 尽调入口与外包/派遣公司名单
# ============================================================
# 用途：Block G 雇主尽调。提供核验入口链接模板 + 已知外包/派遣公司名单（社区可更新）。
# 原则：名单仅供参考，外包≠一定差，但用户有权知道自己签的是不是正式编制。
# ============================================================

meta:
  version: "1.0"
  last_updated: "2026-08"
  sources:
    - "公开招聘与行业社区整理（C级）"
    - "《劳动合同法》第五章第二节 劳务派遣（A级）"
  disclaimer: "公司名单为公开信息整理，随时间变化，仅供识别参考；'知名外包公司'也可能有优质团队与直聘岗位，判断以实际合同主体与岗位性质为准。"

# —— 尽调链接模板（复制替换 {company} 为公司全称） ——
due_diligence_links:
  - {name: "天眼查", url: "https://www.tianyancha.com/search?key={company}", check: "注册资本实缴、成立时间、参保人数、经营异常、司法风险"}
  - {name: "企查查", url: "https://www.qcc.com/web/search?key={company}", check: "同上，交叉验证"}
  - {name: "爱企查(百度)", url: "https://aiqicha.baidu.com/s?q={company}", check: "同上"}
  - {name: "裁判文书网", url: "https://wenshu.court.gov.cn/", check: "搜'{company} 劳动争议'、强制执行、失信被执行"}
  - {name: "中国执行信息公开网", url: "http://zxgk.court.gov.cn/", check: "被执行人/失信被执行记录"}
  - {name: "脉脉公司页", url: "https://maimai.cn/company/search?keyword={company}", check: "员工口碑、离职率、匿名爆料"}
  - {name: "看准网", url: "https://www.kanzhun.com/search/?query={company}", check: "评分、点评、面试经验"}
  - {name: "OfferShow", url: "https://www.offershow.com/", check: "薪资爆料、offer定级参考"}
  - {name: "小红书/即刻搜索", url: "https://www.xiaohongshu.com/search_result?keyword={company}%20裁员", check: "搜'{company} 裁员/欠薪/加班/坑'"}
  - {name: "全国企业信用信息公示系统", url: "https://www.gsxt.gov.cn/", check: "官方渠道，年报/异常名录"}

