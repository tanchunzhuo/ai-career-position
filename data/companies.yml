# —— 外包识别关键词与岗位性质分类 ——
contract_type_classification:
  - {type: "甲方直招", keywords: ["与本公司签订劳动合同"], meaning: "正式员工，优先"}
  - {type: "子公司直签", keywords: ["XX科技（集团子公司）", "XX发展有限公司"], meaning: "正式员工但注意集团与子公司待遇差异"}
  - {type: "劳务派遣", keywords: ["派遣", "派驻", "第三方合同"], meaning: "与派遣公司签合同，在甲方工作；同工同酬权利但福利/编制差异大"}
  - {type: "人力外包", keywords: ["外包", "驻场", "人力外包", "项目外包"], meaning: "外包公司员工；社保/公积金通常按外包公司标准，晋升路径模糊"}
  - {type: "OD（华为等）", keywords: ["OD", "外包编制"], meaning: "外包编制，非正编；转正通道有限，需明确"}
  - {type: "项目制", keywords: ["项目制合同", "以完成一定工作任务为期限"], meaning: "项目结束合同终止；注意社保连续性"}

# —— 高危组合信号 ——
high_risk_signals:
  - "公司成立 <1 年 + 高薪急聘 + 无参保记录"
  - "招聘主体是'XX信息咨询/XX人力资源'，岗位却写大厂名"
  - "面试流程极快（一天内口头offer）且催着签约"
  - "入职前要求交任何费用/办任何'证件'"
  - "合同主体与面试/招聘主体不一致"
  - "薪资高到超出同岗位市场 P75 50% 以上且无合理解释"
