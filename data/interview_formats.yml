# data/interview_formats.yml — 各公司/岗位面试形式库
# ============================================================
# 用途：Block F 面试准备——按公司×岗位预判轮次、形式、考察点。
# 来源：2025-2026 面经汇总（牛客/脉脉/知乎，C级），部分为 A 级常识。
# 说明：各厂各团队流程有差异，以实际面试邀约为准。
# ============================================================

meta:
  version: "1.0"
  last_updated: "2026-08"
  sources:
    - "2025-2026 牛客/脉脉/知乎面经（C级）"
    - "各公司官方招聘流程说明（B级）"
  disclaimer: "面试轮次与形式因团队/职级/岗位而异，本文件为粗粒度参考。"

# —— 通用流程模板 ——
common_flow:
  campus_tech: ["简历筛选", "在线笔试（编程题/性格测评）", "技术一面（基础+算法）", "技术二面（深挖+系统设计）", "主管/交叉面", "HR面", "offer决策"]
  campus_nonteck: ["简历筛选", "在线测评（行测/性格）", "业务一面", "业务二面", "HR面", "offer决策"]
  social_tech: ["简历筛选", "技术一面（同级）", "技术二面（+1 leader）", "交叉面（可选）", "总监面（+2）", "HR面", "offer决策"]
  social_management: ["简历筛选", "业务面（1-2轮）", "高管面", "HR/薪酬面", "offer决策"]

# —— 大厂特色 ——
companies:
  - name: "阿里巴巴"
    positions: ["技术"]
    rounds: "校招：3轮技术+1轮HR（各60-90分钟）；社招P6+：4轮技术+交叉面+HR（共4-6轮）"
    focus:
      - "校招一面90分钟：项目追问+算法"
      - "二面：系统设计+原理深挖"
      - "三面主管面：职业规划+综合判断"
      - "价值观'闻味官'环节：考察与团队气质契合度（C级）"
    tests: ["编程题（牛客/LeetCode）", "性格测评（部分岗位）"]
    source: "mianlingai 2026-05 / 牛客面经"

  - name: "字节跳动"
    positions: ["技术", "非技术"]
    rounds: "3轮专业/业务面+1轮HR面；技术岗每轮2-3道算法题，要求边写边讲思路"
    focus:
      - "算法为王：30分钟内完成Medium题，写后追问'能优化吗'"
      - "考察 context not control（C级）：要的是信息同步与协作，不是控制型管理"
      - "业务面：项目深挖+数据敏感度"
    tests: ["编程题（LeetCode/牛客）", "部分岗位AI/系统设计"]
    source: "知乎2026-04校招全流程 / 面经"

  - name: "腾讯"
    positions: ["技术"]
    rounds: "3面结构：一面60min基础+算法+Linux → 二面深入+网络编程+数据库 → 三面系统设计+项目深挖+并发"
    focus:
      - "底层原理（虚函数表/迭代器失效/malloc原理）"
      - "数据库（索引/InnoDB vs MyISAM）、Redis（RDB vs AOF）"
      - "系统设计（画架构图、表设计）"
    tests: ["编程题", "部分岗位测评"]
    source: "2026届面经（CSDN/牛客）"

  - name: "华为"
    positions: ["技术"]
    rounds: "机考→技术面1-2轮→综合面→HR面；部分岗位有性格测评（华为性格测试，需真实作答）"
    focus:
      - "机考：编程题（牛客华为机考）"
      - "技术面：项目+基础"
      - "综合面：价值观、抗压、'奋斗者'文化契合度"
      - "OD岗位：流程与正编不同，需明确"
    tests: ["机考编程题", "性格测评"]
    source: "牛客面经（C级）"

  - name: "美团/京东/快手/拼多多等"
    positions: ["技术"]
    rounds: "普遍3-4轮：2-3轮技术+HR；美团有交叉面；拼多多流程快但强度面多"
    focus: ["算法+项目", "业务理解", "抗压/稳定性的考察"]
    source: "2025-2026 面经（C级）"

  - name: "国企/央企/银行"
    positions: ["综合"]
    rounds: "网申→笔试（行测+公共基础知识+专业）→面试（结构化/半结构化/无领导小组）→体检政审"
    focus:
      - "行测：数量关系/逻辑判断/资料分析"
      - "半结构化：自我介绍+固定问题+追问"
      - "无领导小组讨论：角色分工与话术"
      - "政审：档案、无犯罪记录（部分岗位）"
    source: "A/B级（公开流程）"

  - name: "外企"
    positions: ["技术", "非技术"]
    rounds: "HR面→技术/业务面2-3轮→交叉面（部分）→Manager面；多轮英文面或英文面试环节"
    focus:
      - "英文自我介绍与专业问答"
      - "STAR 行为面试（behavioral questions）"
      - "价值观匹配（culture fit）"
    source: "B/C级"

# —— 测评系统（中国常见） ——
assessment_systems:
  - {name: "北森", type: "性格/认知测评", note: "大厂普遍使用；有防伪题，'装好员工'会被识破，建议真实作答"}
  - {name: "倍智", type: "性格测评", note: "国企/金融常用；同上"}
  - {name: "智鼎", type: "能力测评", note: "银行/国企笔试常用"}
  - {name: "行测（公务员/国企）", type: "逻辑/数量/资料", note: "刷粉笔/华图题集可短期提升"}
  - {name: "牛客网", type: "编程题平台", note: "技术岗笔试主流；刷'公司真题'"}

# —— 常见岗位面试考察点映射 ——
role_focus:
  - {role: "后端开发", focus: ["算法", "网络/TCP", "数据库", "缓存/消息队列", "分布式基础", "系统设计"]}
  - {role: "前端开发", focus: ["JS/TS原理", "浏览器渲染", "框架原理(React/Vue)", "工程化", "性能优化"]}
  - {role: "算法（大模型方向）", focus: ["Transformer原理", "训练/微调/RLHF", "推理优化", "论文解读", "工程落地"]}
  - {role: "产品经理", focus: ["项目案例深挖", "逻辑/结构化", "行业理解", "数据意识", "团队协作"]}
  - {role: "运营", focus: ["案例复盘", "数据", "内容/用户sense", "抗压", "结果导向"]}
  - {role: "数据分析", focus: ["SQL", "统计/AB实验", "业务理解", "Python/可视化"]}
  - {role: "销售/客户成功", focus: ["业绩案例", "抗压", "沟通", "目标感"]}
