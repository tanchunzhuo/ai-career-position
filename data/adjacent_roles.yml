# data/adjacent_roles.yml — 侧翼岗位知识库
# ============================================================
# meta:
#   version: "1.0"
#   last_updated: "2026-08"
#   sources:
#     - "脉脉高聘《2026春招职场洞察报告》：2026年1-4月AI岗位量同比+8.7倍，具身智能岗位+15倍，Agent工程师Q1需求+310%、供需比1:7.5~8.2"
#     - "商产业研究院：2026国内大模型市场规模突破680亿元，全国复合型AI人才缺口超500万"
#     - "新浪财经2026-07：AI相关岗位需求同比暴涨8.7倍，新增岗位集中在驾驭AI、管控AI、落地AI三大方向"
#     - "行业招聘平台2025-2026公开招聘数据（BOSS直聘/猎聘/看准网）"
#   disclaimer: "本文件不是'未来热门岗位预测'，而是'现在已有真实招聘和付费、且符合侧翼三原则'的岗位集合。预测类一律不收录或标'高投机'。岗位与薪资会随市场变化，决策前请自行核实。"
#
# 侧翼三原则（判定标准，见 prompts/radar.md）：
#   1. 模型越强你越受益（AI 放大你的产出，而非替代你）
#   2. 模型/平台公司不会顺手做掉你（壁垒：行业数据/合规/利益冲突/线下交付/脏活/责任归属）
#   3. 有真实的、可被验证的付费对手方（现在就有人付钱，不是"未来会有需求"）
# ============================================================

meta:
  version: "1.0"
  last_updated: "2026-08"
  sources:
    - "脉脉高聘《2026春招职场洞察报告》"
    - "新浪财经 2026-07 AI岗位盘点"
    - "商产业研究院 2026 大模型市场数据"
    - "BOSS直聘/猎聘/看准网公开招聘与薪酬数据 2025-2026"
  disclaimer: "本文件是'现在已有真实招聘和付费、且符合侧翼三原则'的岗位集合，不是未来热门岗位预测。岗位与薪资会变化，决策前请自行核实；'高投机'条目明确标注。"

# 结构：领域(domain) → 交付类型(delivery) → 岗位条目(roles)
# 每条字段：title / employer_types / sidewing_reasons(三原则) / failure_signals / entry_barrier / salary_ref / risk_level
domains:

  - domain: 互联网与数字化
    delivery: "AI 落地实施"
    roles:
      - title: "企业级 AI 应用落地工程师 / 大模型应用开发工程师（RAG·Agent）"
        employer_types: ["行业甲方数字化部门", "垂直 AI 创业公司", "传统行业转型团队", "系统集成商"]
        sidewing_reasons:
          - "用 AI 放大交付：把通用大模型接到企业私有数据/流程上，产出可量化降本增效（RAG、Agent 编排、模型API集成）"
          - "平台不会顺手做掉：企业数据接入、权限合规、业务定制、长期驻场服务是脏活且责任在交付方"
          - "有人现在付钱：2026 大模型应用开发人才缺口超 50 万，政企/金融/医疗/制造都在采购（商产业研究院2026）"
        failure_signals: "低代码平台进一步傻瓜化，标准场景（客服/知识库问答）被模板化工具吃掉；只剩非标场景"
        entry_barrier: "中：会用大模型 API + 一种后端语言 + 了解 RAG/Agent 原理即可入门，1-2 年经验月薪 28-40K（C级，2026）"
        salary_ref: "应届 15-25K/月，1-2 年 28-40K/月（B/C级，2026-06 itheima 转引招聘数据）"
        risk_level: "中（方向拥挤度上升，但非标落地仍有壁垒）"
      - title: "AI 解决方案架构师 / 售前方案专家"
        employer_types: ["云厂商", "垂直AI公司", "集成商", "行业数字化服务商"]
        sidewing_reasons:
          - "把行业Know-how翻译成AI方案，模型越强方案越好卖"
          - "平台公司缺行业纵深，售前要跟单、要背业绩、要出方案，是平台不愿做的脏活"
          - "付费对手方明确：企业付咨询/实施费；2026 年薪 50-150 万（B/C级，新浪财经2026-07）"
        failure_signals: "AI方案同质化严重、客户只买算力不买方案时溢价消失"
        entry_barrier: "高：需要 5+ 年行业经验 + 表达/商务能力；转行者先做实施再转售前"
        salary_ref: "年薪 50-150 万（C级，2026-07，需资深行业背景）"
        risk_level: "低-中（适合资深人士）"

  - domain: 金融
    delivery: "合规与风控"
    roles:
      - title: "金融合规 AI 评估师 / 算法审计岗"
        employer_types: ["银行/券商/保险合规部", "金融科技公司", "监管科技（RegTech）创业公司"]
        sidewing_reasons:
          - "AI 放大了'读规则+审文本+跑检查'的效率，但责任与判断仍要人担"
          - "平台公司不敢碰金融合规（牌照、责任、监管），壁垒是行业知识与责任归属"
          - "现在有人付钱：金融机构强监管下合规预算刚性；2026 AI合规/算法审计月薪 20-40K（C级，新浪2026-07）"
        failure_signals: "监管把算法审计标准化成模板后初级岗位贬值"
        entry_barrier: "中高：法律/风控/统计背景 + 懂AI基本原理即可切入"
        salary_ref: "20-40K/月，高端年薪百万（C级，2026-07）"
        risk_level: "低（监管趋严是长期趋势）"
      - title: "金融行业 RAG/知识库实施（研报、合规文件、客服）"
        employer_types: ["券商/银行科技部", "金融IT服务商"]
        sidewing_reasons:
          - "金融机构数据敏感、要私有化部署，AI 工具在此是放大器"
          - "数据不出域 + 行业术语 + 审计留痕 = 平台公司难以替代的脏活"
          - "券商/银行 2026 年起批量采购大模型应用（B级，行业报道）"
        entry_barrier: "中：金融业务知识 + 工程能力"
        salary_ref: "对标互联网 80-90% 档，见 salary.yml"
        risk_level: "中"

  - domain: 法律
    delivery: "文档与尽调"
    roles:
      - title: "法律 AI 应用实施 / 律师 AI 工具使用者（提效型岗位）"
        employer_types: ["律所", "企业法务部", "法律科技公司"]
        sidewing_reasons:
          - "AI 大幅提效合同审查/检索，律师用AI做掉'低价值'部分，把时间花在高价值判断"
          - "模型公司无法承担律师执业责任，资格与责任是硬壁垒"
          - "现在有人付钱：律所/法务为效率付费；AI 工具订阅+实施服务"
        entry_barrier: "高（需要法律资质或法务经验），AI 只是放大器不是替代品"
        salary_ref: "律师薪资结构（服务费制），AI提效后产能提升"
        risk_level: "低（执业壁垒）"

  - domain: 医疗健康
    delivery: "落地实施与合规"
    roles:
      - title: "医疗+AI 解决方案实施 / 医学信息与数据治理"
        employer_types: ["医院信息科", "医疗AI公司", "医保/卫健数字化供应商"]
        sidewing_reasons:
          - "AI 辅助诊断/病历质控提效，但责任、伦理、院内数据合规必须人扛"
          - "平台公司进不了医院流程（合规+利益格局+责任），需要懂医又懂IT的中间层"
          - "现在有人付钱：智慧医院、医保控费、影像AI采购持续（行业公开数据）"
        failure_signals: "医疗AI监管收紧导致落地放缓"
        entry_barrier: "中高：医学/护理/卫生管理背景 + 数字化经验"
        salary_ref: "对标城市 IT 中位数上浮，见 salary.yml"
        risk_level: "中"

  - domain: 智能制造
    delivery: "质检与流程"
    roles:
      - title: "工业 AI 质检流程工程师 / 制造业数字化转型工程师"
        employer_types: ["制造业工厂（甲方）", "工业AI公司", "自动化集成商"]
        sidewing_reasons:
          - "AI 视觉质检/预测性维护提效，但产线环境、数据采集、验收交付是脏活"
          - "平台公司不下车间，行业know-how在工厂；责任在交付方"
          - "现在有人付钱：珠三角/长三角制造企业批量上AI质检（C级，招聘数据）"
        entry_barrier: "中：工业工程/自动化背景 + 机器学习应用能力；应届 8-12K 起（C级，2026）"
        salary_ref: "应届 8-12K/月，3年 20-30K/月（C级，2026）"
        risk_level: "低-中（制造业AI渗透率仍低）"

  - domain: 教育
    delivery: "教研与内容"
    roles:
      - title: "AI 教研员 / 教育AI产品落地（校内外）"
        employer_types: ["教育科技公司", "学校/培训机构", "出版社数字化部门"]
        sidewing_reasons:
          - "AI 生成个性化练习/批改/讲义，教研员负责内容质量与教学法"
          - "内容版权、教学责任、家校信任 = 平台公司不轻易进"
          - "现在有人付钱：学校/机构为AI教学系统付费"
        entry_barrier: "中：教学经验 + AI工具使用能力"
        salary_ref: "10-20K/月（C级，2026-07 AI内容运营/教研类）"
        risk_level: "中（政策波动）"

  - domain: 设计内容创作
    delivery: "AI 内容生产与审核"
    roles:
      - title: "AI 内容运营 / 数字人运营 / AIGC 视觉设计师"
        employer_types: ["MCN/内容公司", "品牌方", "数字人服务商"]
        sidewing_reasons:
          - "AI 批量生产短视频/图文/数字人，运营负责选题、调性、数据、转化——放大而非替代"
          - "平台公司不缺生成能力，缺垂类内容操盘与投放经验"
          - "现在有人付钱：品牌/电商为内容与转化付费（预算转移到AI内容团队）"
        failure_signals: "内容同质化、平台算法变化导致产能贬值；纯工具型岗位被卷掉"
        entry_barrier: "低：会工具+懂平台玩法即可入行；但只有'会用AI'不值钱，要有审美/选题/数据能力"
        salary_ref: "10-20K/月（C级，2026-07）；高级操盘手 30K+"
        risk_level: "中高（低门槛=卷；必须建立选题/数据壁垒）"

  - domain: 外贸出海
    delivery: "跨境数字化"
    roles:
      - title: "出海电商 AI 运营 / 跨境电商数据与投放（含小语种AI工具化）"
        employer_types: ["跨境电商公司", "外贸工厂", "出海SaaS"]
        sidewing_reasons:
          - "AI 翻译/选品/客服/素材生成放大单人产能，一个人管多店铺"
          - "平台公司不做跨境履约与本地化脏活；时区/文化/合规是壁垒"
          - "现在有人付钱：外贸与跨境卖家为增长付费"
        entry_barrier: "中：电商经验/语言 + AI工具链"
        salary_ref: "底薪+提成结构常见，底薪 8-15K + 提成（C级）"
        risk_level: "中（平台政策与合规风险）"

  - domain: 财会税务
    delivery: "自动化与合规"
    roles:
      - title: "财税 AI 自动化实施 / 智能财务分析师"
        employer_types: ["企业财务部", "代账/财税服务公司", "财务SaaS公司"]
        sidewing_reasons:
          - "AI 自动记账/对账/报表提效，但税务责任、审计留痕、业财判断要人"
          - "平台公司不背财税责任，行业规则本地化（发票/税务申报）是壁垒"
          - "现在有人付钱：财务共享中心、代账公司为自动化付费"
        entry_barrier: "中：财务/会计背景 + 流程自动化能力"
        salary_ref: "对标城市财务岗中位数上浮 20-30%（C级）"
        risk_level: "中"

  - domain: 人力资源
    delivery: "招聘与组织"
    roles:
      - title: "AI 招聘运营 / 人才数据分析师"
        employer_types: ["HR SaaS公司", "大型企业HR部门", "猎头公司"]
        sidewing_reasons:
          - "AI 筛简历/人岗匹配/面试辅助提效，但判断、沟通、雇主品牌要人"
          - "平台公司做通用招聘工具，做不了行业人脉与背调责任"
          - "现在有人付钱：企业为招聘效率付费（ATS/智能筛选订阅）"
        entry_barrier: "低-中：HR经验 + 数据/AI工具"
        salary_ref: "8-20K/月（C级，2026）"
        risk_level: "中高（HR通用岗位本身被AI挤压，必须向'工具使用者+数据决策'转型）"

  - domain: 通用提示（高投机预警区）
    delivery: "纯工具型"
    roles:
      - title: "⚠️ 高投机：通用 Prompt 工程师 / 通用 AI 产品经理 / AI 内容号"
        employer_types: ["—"]
        sidewing_reasons: []
        failure_signals: "在'正前方'：千军万马和模型公司都在冲，通用能力没有壁垒；模型能力升级直接抹平"
        entry_barrier: "低"
        salary_ref: "—"
        risk_level: "高投机（不推荐作为独立方向，仅作为能力叠加）"
