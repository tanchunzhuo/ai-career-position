# ============ 五、薪资解析规则（供 Block D 使用） ============
parsing_rules:
  - {pattern: "K×N薪 / K·N薪", meaning: "月薪×N个月（含年终折算）", example: "25-40K×15薪 → 年化37.5-60万"}
  - {pattern: "面议", risk: "通常偏低/要压价；提示追问预算区间", example: ""}
  - {pattern: "底薪+绩效/提成", risk: "基本薪资<70%视为绩效占比过高红旗", example: "8-12K（底薪4K+绩效）"}
  - {pattern: "期权/股票/RSU", risk: "必须追问归属期、cliff、行权价、离职处理", example: "30K+期权"}
  - {pattern: "试用期打折>20%", risk: "试用期工资不得低于转正80%（法律红线，A级）", example: ""}
  - {pattern: "外企月薪·13months+RSU", meaning: "13薪=12薪+1薪圣诞/年奖；RSU按归属期折算", example: "25-40K·13months+RSU"}

