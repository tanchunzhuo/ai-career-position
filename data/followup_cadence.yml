# data/followup_cadence.yml — 跟进节奏规则
# ============================================================
# 用途：投递后跟进节奏（Block E / negotiation.md / tracker.py 共用）
# 状态机：已评估 → 已投递 → 简历筛选中 → 笔试中 → 面试中 → Offer中 → 已接受/已拒绝/已默拒
# ============================================================

meta:
  version: "1.0"
  last_updated: "2026-08"
  sources: ["求职行业通用惯例（A/B级）", "猎头行业跟进节奏（B级）"]
  disclaimer: "跟进节奏因公司/岗位/校招社招而异，以下为默认建议，可被用户 profile.yml 覆盖。"

rules:
  - {status: "已投递", next_action: "等待+准备", after_days: 5, reminder: "投递超5天无跟进：发一条礼貌跟进（问简历是否进入筛选/是否需要补充材料）", cadence_note: "第5天 1 次；第10天可再 1 次，之后转'已默拒'处理"}
  - {status: "简历筛选中", next_action: "准备笔试/面试", after_days: 7, reminder: "超7天：可询问筛选进度（视渠道：内推可问内推人，海投慎催）"}
  - {status: "笔试中", next_action: "刷题+等待", after_days: 5, reminder: "笔试后5天无反馈：礼貌询问结果"}
  - {status: "面试中", next_action: "感谢信+复盘", after_days: 1, reminder: "面试后24小时内发感谢信；3-5个工作日无反馈跟进1次；超7天提示可能默拒"}
  - {status: "Offer中", next_action: "谈薪+对比", after_days: 7, reminder: "offer后7天未答复是危险信号（对方可能在等别人）；如需拖延，明确告知时间线"}
  - {status: "已接受", next_action: "入职准备", after_days: 0, reminder: "确认offer letter细节、背调材料、入职材料清单"}
  - {status: "已拒绝/已默拒", next_action: "复盘+下一目标", after_days: 0, reminder: "记录失败原因进复盘库，供下次优化"}

health_checks:
  - "已投递超5天无跟进 → 提醒跟进"
  - "面试后超3天无反馈 → 提醒跟进/准备默拒"
  - "offer超7天未答复 → 紧急提醒决策"
  - "重复投递同公司同岗 → 提示（可能被判垃圾简历）"
  - "渠道通过率统计：内推/猎头/官网/平台 各渠道的简历通过率→面试通过率，建议集中精力到高效渠道"

thanks_note_template: |
  尊敬的[面试官姓名/HR]：
  感谢您今天的时间与交流，让我对[岗位名]和[公司名]有了更具体的了解。
  今天聊到的[具体话题，如：某业务/某项目/某方法]让我很受启发。
  我对这个岗位仍然非常感兴趣，也相信自己能在[某方面]带来价值。
  期待后续进展，如有需要补充的材料请随时告诉我。
  祝工作顺利！
  [你的名字]

followup_message_template: |
  [HR/面试官]您好，我是[名字]，[日期]参加了[岗位]的[环节]。
  想了解下目前的进展，方便的话期待您的反馈。
  如有需要补充的信息我也随时可以提供。谢谢！

offer_extension_template: |
  非常感谢贵司的offer与信任。
  出于对职业发展的谨慎考虑，我希望能有[X]天的考虑时间，
  以便更全面地评估（如与其他流程的协调）。
  我会在[日期]前给出明确答复。再次感谢！
